<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GABU — arquivo multimídia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#000000;
    --grey:#F2F2F2;
    --soft:rgba(0,0,0,.5);
    --line:rgba(0,0,0,.12);
    --sans:"Inter", Helvetica, system-ui, sans-serif;
    --edge:clamp(20px,5vw,72px);
    --shift:clamp(.75rem,3vw,3.5rem);
    --ease:cubic-bezier(.22,1,.36,1);
    --c-escrita:#6C1FC7;
    --c-cinema:#4E7BD6;
    --c-fotografia:#3FBFDD;
    --c-som:#7CE9C6;
    --c-videocast:#9B5CF0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:clamp(1rem,1.02vw,1.1rem);
    line-height:1.5;-webkit-font-smoothing:antialiased;text-transform:lowercase;
  }
  /* maiúsculas preservadas só no conteúdo das publicações */
  .item h1,.item .meta,.prose,.ficha dd,.np-title,
  .list h2,.list .k,.list .m{text-transform:none}
  a{color:inherit;text-decoration:none}
  img,iframe{display:block;max-width:100%}
  ::selection{background:var(--ink);color:#fff}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  svg{display:block}

  /* ===== view transition ===== */
  #app{transition:opacity .4s var(--ease),transform .4s var(--ease)}
  #app.is-leaving{opacity:0;transform:translateY(10px)}
  @media (prefers-reduced-motion:reduce){
    #app{transition:none}
    html{scroll-behavior:auto}
  }

  /* ===================== HOME ===================== */
  .home{height:100svh;min-height:480px;display:flex;flex-direction:column;overflow:hidden;
    padding:clamp(.8rem,2.2vh,2rem) var(--edge) clamp(.8rem,2.2vh,2rem) calc(var(--edge) + var(--shift))}
  .home .wordmark{
    font-weight:800;font-size:min(30vw,40vh);line-height:.8;
    letter-spacing:-.055em;margin:30px 0 0;text-transform:uppercase;color:var(--ink)}
  .home .contact{margin:auto 0}
  .cursor-gabu{position:fixed;left:0;top:0;z-index:40;pointer-events:none;
    font-family:var(--sans);font-weight:800;font-size:calc(clamp(1.1rem,1.6vw,1.6rem) + 2px);
    letter-spacing:-.045em;line-height:1;text-transform:lowercase;color:var(--ink);
    transform:translate3d(-200px,-200px,0);will-change:transform;opacity:0;transition:opacity .3s var(--ease)}
  @media (hover:none){.cursor-gabu{display:none}}
  @media(min-width:900px){
    .home{display:grid;column-gap:clamp(2rem,4vw,4.5rem);align-items:start;
      grid-template-columns:1fr minmax(300px,36%);
      grid-template-rows:auto 1fr auto 1fr auto;
      grid-template-areas:"brand menu" ". menu" "contact menu" ". menu" "social menu"}
    .home .wordmark{grid-area:brand;align-self:center;font-size:min(21vw,42vh)}
    .home .cats{grid-area:menu;align-self:center;margin:0}
    .home .contact{grid-area:contact;align-self:center;margin:0}
    .home .socials{grid-column:1 / -1;grid-row:5;align-self:end;justify-content:flex-end}
  }
  .cats{border-top:1px solid var(--ink);margin:clamp(.5rem,1.8vh,1.6rem) 0}
  .cat{
    position:relative;overflow:hidden;display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
    border-bottom:1px solid var(--line);
    padding:clamp(.12rem,1.2vh,1rem) clamp(.1rem,1.6vw,1.2rem);
    font-weight:700;font-size:clamp(1.5rem,min(6.5vw,7.5vh),4.5rem);letter-spacing:-.045em;line-height:1.05;
    color:var(--c);
    transition:color .45s var(--ease),padding-left .5s var(--ease)}
  .cat .label,.cat .cnt{position:relative;z-index:2}
  .cat .cnt{white-space:nowrap}
  .cat::before{content:"";position:absolute;inset:0;z-index:1;background:var(--c);
    transform:scaleX(0);transform-origin:left center;transition:transform .55s var(--ease)}
  @media (hover:hover){
    .cat:hover{color:var(--fg);padding-left:clamp(.6rem,3vw,2rem)}
    .cat:hover::before{transform:scaleX(1)}
  }
  .cat:focus-visible{color:var(--fg)}
  .cat:focus-visible::before{transform:scaleX(1)}

  .home-foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.2rem 2.5rem}
  .contact{font-weight:600;font-size:clamp(1.3rem,3vw,2.4rem);letter-spacing:-.03em;line-height:1.1;margin:0}
  .contact a{box-shadow:inset 0 -3px var(--ink);transition:box-shadow .3s var(--ease)}
  .contact a:hover{box-shadow:inset 0 -.6em rgba(0,0,0,.08)}
  .socials{display:flex;flex-wrap:wrap;gap:1.3rem;font-size:.95rem;font-weight:500;justify-content:flex-end}
  .socials a{position:relative;padding-bottom:.2em}
  .socials a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1.5px;
    background:var(--ink);transition:right .35s var(--ease)}
  .socials a:hover::after{right:0}

  /* ===================== SHARED (cat + item) ===================== */
  .wrap{padding:clamp(1.4rem,3vw,2.4rem) var(--edge) clamp(3rem,8vw,6rem) calc(var(--edge) + var(--shift));min-height:100svh}
  .crumbs{position:sticky;top:clamp(.8rem,2vh,1.4rem);z-index:30;
    display:flex;flex-wrap:wrap;width:max-content;max-width:100%;align-items:center;gap:.45em .6em;
    font-weight:700;font-size:clamp(.85rem,1.2vw,1.05rem);letter-spacing:.07em;
    color:var(--ink);margin-bottom:clamp(2rem,6vw,4.5rem)}
  .crumbs a{color:var(--ink);transition:color .25s var(--ease)}
  .crumbs a:hover{color:var(--c)}
  .crumbs .sep{color:var(--soft);font-weight:500}
  .crumbs .cur{color:var(--soft);max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===================== CATEGORY ===================== */
  .cat-head{display:flex;flex-direction:column;gap:.8rem;
    padding-bottom:clamp(1.5rem,4vw,2.5rem);border-bottom:2px solid var(--ink)}
  .cat-head .ic{color:var(--c)}
  .cat-head .ic svg{width:clamp(38px,5vw,64px);height:clamp(38px,5vw,64px)}
  .cat-head h1{font-weight:700;font-size:clamp(3rem,14vw,11rem);line-height:.85;
    letter-spacing:-.05em;margin:0;text-transform:uppercase}
  .cat-head .sub{color:var(--soft);font-size:clamp(1rem,1.6vw,1.2rem)}

  /* preview de fundo da página inteira (troca por publicação) */
  .cat-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .cat-bg .pv{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease);
    display:flex;align-items:center;justify-content:center;padding:clamp(2rem,8vw,8rem)}
  .cat-bg .pv.on{opacity:.13}
  .cat-bg .lp-img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.04)}
  .cat-bg .lp-text{margin:0;max-width:22ch;font-weight:500;letter-spacing:-.02em;
    font-size:clamp(1.6rem,4.2vw,3.4rem);line-height:1.3;color:var(--ink)}
  .cat-bg .lp-word{font-weight:800;font-size:clamp(7rem,28vw,24rem);line-height:.85;
    letter-spacing:-.05em;color:var(--c);text-transform:uppercase;white-space:nowrap}

  .list{list-style:none;margin:0;padding:0;position:relative;z-index:1}
  .list li{border-bottom:1px solid var(--line);position:relative}
  .list a{position:relative;display:block;
    padding:clamp(1.6rem,4vw,3rem) 0;transition:padding-left .45s var(--ease)}
  .lp-fg{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.5rem 1.5rem}
  .list .k{grid-column:1;font-size:.78rem;font-weight:600;letter-spacing:.06em;
    color:var(--soft);transition:color .3s var(--ease)}
  .list h2{grid-column:1;font-weight:600;font-size:clamp(2rem,7vw,5.5rem);line-height:1;
    letter-spacing:-.035em;margin:.25rem 0 0;min-height:1em}
  .list .m{grid-column:2;grid-row:1/3;font-size:.85rem;font-weight:500;color:var(--soft);
    white-space:nowrap;display:flex;align-items:center;gap:1rem}
  .list .ar{color:var(--c);opacity:0;transform:translateX(-.5em);
    transition:opacity .3s var(--ease),transform .45s var(--ease);font-size:1.4em}
  @media (hover:hover){
    .list a:hover{padding-left:clamp(.6rem,2vw,1.6rem)}
    .list a:hover .k{color:var(--c)}
    .list a:hover .ar{opacity:1;transform:translateX(0)}
  }
  .type.typing::after{content:"▍";color:var(--c);margin-left:.04em;animation:caret .7s steps(1) infinite}
  @keyframes caret{50%{opacity:0}}
  .list li{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .list li.seen{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.list li{opacity:1;transform:none}}

  /* ===================== ITEM ===================== */
  .item{width:100%}
  .progress{position:fixed;top:0;left:0;height:5px;width:0;background:var(--c);
    z-index:60;transition:width .08s linear}
  .watermark{position:fixed;left:clamp(4px,1.2vw,18px);top:50%;
    writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);transform-origin:center;
    font-weight:800;font-size:clamp(1.4rem,2.6vw,3rem);letter-spacing:.3em;text-transform:uppercase;
    color:var(--c);opacity:1;pointer-events:none;user-select:none;z-index:5}
  @media (max-width:700px){.watermark{display:none}}
  .item h1{font-weight:700;font-size:clamp(2.6rem,9vw,8rem);line-height:.92;letter-spacing:-.045em;
    margin:.9rem 0 .5rem}
  .item .meta{color:var(--soft);font-size:clamp(1rem,1.6vw,1.25rem);margin-bottom:clamp(1.8rem,4vw,3rem)}

  .media{margin:0 0 clamp(1.8rem,4vw,3rem)}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:var(--grey);overflow:hidden;border-radius:4px}
  .frame.square{aspect-ratio:1/1;max-width:720px}
  .frame.auto{aspect-ratio:auto}
  .frame iframe{width:100%;height:100%;border:0}
  .frame img{width:100%;height:100%;object-fit:cover}
  .spotify iframe{border-radius:12px}
  .photo{display:block;width:100%;max-height:82vh;object-fit:contain;background:var(--grey);border-radius:4px}

  /* ===== player nativo (som) — máscara clara sobre o embed do Spotify ===== */
  .nplayer{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    background:var(--paper);isolation:isolate}
  .np-embed{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .np-embed-inner,.np-embed iframe{width:100%;height:100%;border:0}
  .np-mask{position:relative;z-index:1;background:var(--paper);
    display:flex;gap:clamp(1rem,3vw,2rem);padding:clamp(1.2rem,3vw,2rem)}
  .np-cover{flex:0 0 auto;width:clamp(84px,17vw,180px);aspect-ratio:1;border-radius:8px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,var(--grey)),var(--grey))}
  .np-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.7rem}
  .np-kicker{font-size:.82rem;font-weight:600;color:var(--soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np-title{font-weight:700;font-size:clamp(1.2rem,2.2vw,1.8rem);letter-spacing:-.02em;line-height:1.15;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np-bar{height:6px;border-radius:3px;background:#e6e6e6;cursor:pointer;position:relative;outline:none;margin-top:.3rem}
  .np-bar:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}
  .np-fill{height:100%;width:0;background:var(--c);border-radius:3px;position:relative}
  .np-fill::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border-radius:50%;background:var(--c)}
  .np-times{display:flex;justify-content:space-between;font-size:.75rem;color:var(--soft);font-variant-numeric:tabular-nums}
  .np-controls{display:flex;align-items:center;justify-content:center;gap:clamp(1rem,3vw,1.8rem);margin-top:.4rem}
  .np-btn{border:none;background:transparent;color:var(--ink);cursor:pointer;
    font-family:var(--sans);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:.15em;
    transition:color .2s var(--ease)}
  .np-btn:hover{color:var(--c)}
  .np-play{width:clamp(54px,8vw,66px);height:clamp(54px,8vw,66px);border-radius:50%;border:none;
    background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .2s var(--ease)}
  .np-play:hover{transform:scale(1.05)}
  .np-ico{width:0;height:0;border-style:solid;border-width:9px 0 9px 15px;
    border-color:transparent transparent transparent #fff;margin-left:3px}
  .np-play.playing .np-ico{width:14px;height:16px;border:0;margin:0;
    background:linear-gradient(to right,#fff 0 34%,transparent 34% 66%,#fff 66% 100%)}
  @media(max-width:560px){.np-mask{flex-direction:column}.np-cover{width:100%;aspect-ratio:16/9}}
  @media (prefers-reduced-motion:no-preference){.np-fill{transition:width .2s linear}}

  /* ===== carousel (fotografia) ===== */
  .carousel{position:relative}
  .carousel-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
    border-radius:4px;background:var(--grey);scrollbar-width:none}
  .carousel-track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/2;background:var(--grey)}
  .slide img{width:100%;height:100%;object-fit:cover;display:block}
  .cbtn{position:absolute;top:calc(50% - 22px);transform:translateY(-50%);z-index:3;
    width:46px;height:46px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;
    font-size:1.7rem;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:background .25s var(--ease)}
  .cbtn:hover{background:var(--c)}
  .cbtn.prev{left:12px}
  .cbtn.next{right:12px}
  .ccount{position:absolute;top:12px;right:12px;z-index:3;
    background:rgba(0,0,0,.6);color:#fff;font-size:.78rem;font-weight:600;letter-spacing:.04em;
    padding:.3rem .6rem;border-radius:100px}
  .cdots{display:flex;gap:.5rem;justify-content:center;margin-top:.9rem}
  .cdots button{width:9px;height:9px;padding:0;border:none;border-radius:50%;
    background:var(--line);cursor:pointer;transition:background .25s var(--ease),transform .25s var(--ease)}
  .cdots button[aria-current="true"]{background:var(--c);transform:scale(1.25)}

  .prose{max-width:34ch;font-weight:400;
    font-size:clamp(1.35rem,2.6vw,2.1rem);line-height:1.4;letter-spacing:-.015em}
  .prose p{margin:0 0 1.1em}
  .prose p:first-child::first-letter{font-weight:700;color:var(--c);font-size:1.15em;line-height:.9}

  .item-body{display:grid;grid-template-columns:1fr;gap:clamp(1.6rem,4vw,3rem)}
  @media(min-width:900px){
    .item-body.has-aside{grid-template-columns:minmax(0,1fr) minmax(240px,340px);align-items:start}
    .item-aside{position:sticky;top:clamp(4.5rem,10vh,6rem)}
  }
  .item-main{min-width:0}

  .ficha{margin-top:0}
  .ficha h2{font-size:.78rem;font-weight:600;letter-spacing:.06em;color:var(--soft);
    margin:0 0 .4rem;padding-bottom:.8rem;border-bottom:2px solid var(--ink)}
  .ficha dl{margin:0}
  .ficha .row{display:flex;flex-direction:column;gap:.2rem;
    padding:clamp(.7rem,1.4vw,1rem) 0;border-bottom:1px solid var(--line)}
  .ficha dt{font-size:.74rem;font-weight:600;letter-spacing:.05em;color:var(--soft)}
  .ficha dd{margin:0;font-weight:500;font-size:clamp(1.1rem,1.5vw,1.35rem);letter-spacing:-.015em}

  .share{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem;
    margin-top:clamp(2rem,5vw,3.5rem);padding-top:clamp(1.4rem,3vw,2rem);border-top:1px solid var(--line)}
  .btn{border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;
    font-family:var(--sans);font-size:.9rem;font-weight:500;padding:.6rem 1.2rem;border-radius:100px;
    display:inline-flex;align-items:center;gap:.6em;transition:background .3s var(--ease),color .3s var(--ease)}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn svg{width:16px;height:16px}
  .nextlink{margin-left:auto;font-weight:600;font-size:clamp(1rem,1.8vw,1.3rem);letter-spacing:-.02em;
    display:inline-flex;align-items:center;gap:.5em;transition:gap .3s var(--ease),color .3s var(--ease)}
  .nextlink:hover{gap:.9em;color:var(--c)}
  .nextlink small{display:block;font-size:.7rem;font-weight:500;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}

  /* ===== contact form ===== */
  a.contact .arw{display:inline-block;transition:transform .35s var(--ease)}
  a.contact:hover .arw{transform:translateX(.3em)}
  .form{max-width:760px;margin-top:clamp(1.5rem,4vw,2.6rem)}
  .field{display:block;margin-bottom:clamp(1.4rem,3.5vw,2.4rem)}
  .field span{display:block;font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--soft);margin-bottom:.6rem}
  .field input,.field textarea{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;
    font-family:var(--sans);font-size:clamp(1.2rem,2.6vw,2rem);font-weight:500;letter-spacing:-.015em;
    padding:.35rem 0;color:var(--ink);transition:border-color .3s var(--ease)}
  .field textarea{resize:vertical;line-height:1.4}
  .field input::placeholder,.field textarea::placeholder{color:rgba(0,0,0,.28);font-weight:400;text-transform:lowercase}

  /* ===== contato sem scroll, espaçamento distribuído ===== */
  .contact-page{height:100svh;min-height:0;overflow:hidden;display:flex;flex-direction:column;
    padding-top:clamp(1.2rem,3vh,2.2rem);padding-bottom:clamp(1.2rem,3.5vh,2.4rem)}
  .contact-page .item{flex:1;min-height:0;display:flex;flex-direction:column}
  .contact-page .crumbs{margin-bottom:0}
  .contact-page .form{margin:auto auto 0;width:100%;max-width:620px;
    display:flex;flex-direction:column;gap:clamp(1rem,2.6vh,1.9rem)}
  .contact-page .field{margin:0}
  .contact-page .field span{margin-bottom:clamp(.3rem,1vh,.6rem)}
  .contact-page .field input,.contact-page .field textarea{font-size:clamp(1.05rem,2.2vh,1.6rem)}
  .contact-page .field.msg textarea{resize:none}
  .contact-page .btn.primary{align-self:flex-start}
  .contact-page .alt{margin:clamp(1.2rem,3vh,2rem) auto auto;width:100%;max-width:620px;text-align:center}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--c)}
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:1rem;padding:.9rem 1.7rem}
  .btn.primary:hover{background:var(--c);border-color:var(--c);color:#fff}
  .formnote{margin:1rem 0 0;font-weight:500;color:var(--c)}
  .alt{margin-top:clamp(1.6rem,4vw,2.4rem);color:var(--soft);font-size:1.05rem}
  .alt a{color:var(--ink);box-shadow:inset 0 -2px var(--c)}
</style>
</head>
<body>
<div class="cursor-gabu" aria-hidden="true">gabu</div>
<div id="app"></div>

<!-- Form estático só para o Netlify detectar os campos no build (o form visível é injetado via JS) -->
<form name="contato" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true">
  <input type="hidden" name="form-name" value="contato">
  <input type="text" name="nome">
  <input type="email" name="email">
  <input type="text" name="assunto">
  <textarea name="mensagem"></textarea>
  <input name="bot-field">
</form>

<script>
(function(){
  /* ---------- icons ---------- */
  var IC = {
    escrita:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L20 7a2 2 0 0 0-3-3L5 16l-1 4z"/><path d="M14.5 6.5l3 3"/></svg>',
    cinema:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l-2 5M14 4l-2 5"/></svg>',
    fotografia:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4M21 12h-9M12 21l6.4-6.4"/></svg>',
    som:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>'
  };
  var SHARE_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3M8 7l4-4 4 4"/></svg>';

  /* ---------- data ---------- */
  var CATS = [
    {id:'escrita',   label:'Escrita',    desc:'Ensaios e notas'},
    {id:'cinema',    label:'Cinema',     desc:'Curtas e clipes'},
    {id:'fotografia',label:'Fotografia', desc:'Séries fotográficas'},
    {id:'som',       label:'Som',        desc:'Podcasts'},
    {id:'videocast', label:'Videocast',  desc:'B9 no YouTube'}
  ];

  var ITEMS = [];
  var SITE = {
    email:'oi@gabu.cc',
    socials:[{label:'Instagram',url:'#'},{label:'YouTube',url:'#'},{label:'Spotify',url:'#'},{label:'Newsletter',url:'#'}]
  };

  function catOf(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i]; return null; }
  function itemsOf(cat){ return ITEMS.filter(function(x){return x.cat===cat;}); }
  function itemOf(id){ for(var i=0;i<ITEMS.length;i++) if(ITEMS[i].id===id) return ITEMS[i]; return null; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  // Spotify Embed IFrame API (motor de áudio por trás do player nativo)
  var SP_API = null, SP_PENDING = [];
  window.onSpotifyIframeApiReady = function(API){
    SP_API = API;
    SP_PENDING.forEach(function(fn){ fn(API); });
    SP_PENDING = [];
  };
  function withSpotify(fn){ if(SP_API){ fn(SP_API); } else { SP_PENDING.push(fn); } }
  function fmtTime(s){ s=Math.max(0,Math.floor(s||0)); var m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }

  function initPlayers(){
    document.querySelectorAll('.nplayer').forEach(function(np){
      if(np.dataset.ready) return; np.dataset.ready='1';
      var embed = np.querySelector('[data-embed]');
      var uri = np.dataset.uri;
      withSpotify(function(API){
        API.createController(embed, {uri:uri, width:'100%', height:'352'}, function(ctrl){
          wirePlayer(np, ctrl);
        });
      });
    });
  }
  function wirePlayer(np, ctrl){
    var playBtn=np.querySelector('.np-play'), fill=np.querySelector('.np-fill'),
        cur=np.querySelector('.np-cur'), dur=np.querySelector('.np-dur'), bar=np.querySelector('.np-bar');
    var duration=0, pos=0;
    function act(a){
      if(a==='toggle') ctrl.togglePlay();
      else if(a==='restart') ctrl.seek(0);
      else if(a==='back') ctrl.seek(Math.max(0, pos-15));
      else if(a==='fwd') ctrl.seek(duration ? Math.min(duration, pos+15) : pos+15);
    }
    np.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click', function(){ act(b.dataset.act); });
    });
    function seekAt(clientX){
      if(!duration) return;
      var r=bar.getBoundingClientRect();
      ctrl.seek(Math.max(0,Math.min(1,(clientX-r.left)/r.width))*duration);
    }
    bar.addEventListener('click', function(e){ seekAt(e.clientX); });
    bar.addEventListener('keydown', function(e){
      if(!duration) return;
      if(e.key==='ArrowRight'){ e.preventDefault(); ctrl.seek(Math.min(duration, pos+10)); }
      if(e.key==='ArrowLeft'){ e.preventDefault(); ctrl.seek(Math.max(0, pos-10)); }
    });
    ctrl.addListener('playback_update', function(e){
      var d=e.data; duration=(d.duration||0)/1000; pos=(d.position||0)/1000;
      fill.style.width=(duration?(pos/duration*100):0)+'%';
      cur.textContent=fmtTime(pos); dur.textContent=fmtTime(duration);
      playBtn.classList.toggle('playing', !d.isPaused);
    });
  }

  function crumbs(trail){
    return '<nav class="crumbs" aria-label="Você está aqui">'+trail.map(function(t,i){
      var sep = i>0 ? '<span class="sep" aria-hidden="true">/</span>' : '';
      return sep + (t.href
        ? '<a href="'+t.href+'">'+esc(t.label)+'</a>'
        : '<span class="cur" aria-current="page">'+esc(t.label)+'</span>');
    }).join('')+'</nav>';
  }

  /* ---------- views ---------- */
  function homeView(){
    var cats = CATS.map(function(c){
      return '<a class="cat" href="#/c/'+c.id+'" style="--c:var(--c-'+c.id+');--fg:#fff">'+
        '<span class="label">'+c.label+'</span></a>';
    }).join('');
    return '<header class="home">'+
      '<nav class="cats" aria-label="Categorias">'+cats+'</nav>'+
      '<a class="contact" href="#/contato">Contato</a>'+
      '<nav class="socials" aria-label="Redes sociais">'+
        (SITE.socials||[]).map(function(s){return '<a href="'+esc(s.url||'#')+'">'+esc(s.label||'')+'</a>';}).join('')+
      '</nav></header>';
  }

  function previewBg(x){
    if(x.kind==='youtube')
      return '<img class="lp-img" src="https://img.youtube.com/vi/'+x.src+'/hqdefault.jpg" alt="" loading="lazy">';
    if(x.kind==='image'){
      var img = (x.gallery && x.gallery.length) ? x.gallery[0] : x.src;
      return '<img class="lp-img" src="'+img+'" alt="" loading="lazy">';
    }
    if(x.kind==='text')
      return '<p class="lp-text">'+esc((x.body && x.body[0]) || '')+'</p>';
    if(x.kind==='spotify')
      return '<span class="lp-word">'+esc(x.k)+'</span>';
    return '';
  }

  function catView(c){
    var list = itemsOf(c.id).map(function(x){
      return '<li><a href="#/p/'+x.id+'">'+
        '<span class="lp-fg">'+
          '<span class="k">'+esc(x.k)+'</span>'+
          '<h2 class="type" data-text="'+esc(x.title)+'">'+esc(x.title)+'</h2>'+
          '<span class="m">'+esc(x.meta)+' <span class="ar" aria-hidden="true">→</span></span>'+
        '</span>'+
        '</a></li>';
    }).join('');
    return '<div class="wrap" style="--c:var(--c-'+c.id+')">'+
      crumbs([{label:'gabu',href:'#/'},{label:c.label}])+
      '<ul class="list">'+list+'</ul></div>';
  }

  function mediaHtml(x){
    if(x.kind==='youtube')
      return '<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/'+x.src+'" title="'+esc(x.title)+'" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
    if(x.kind==='image'){
      var imgs = (x.gallery && x.gallery.length) ? x.gallery : [x.src];
      if(imgs.length>1){
        var slides = imgs.map(function(u,i){
          return '<div class="slide"><img src="'+u+'" alt="'+esc(x.title)+' — imagem '+(i+1)+'" loading="lazy"></div>';
        }).join('');
        var dots = imgs.map(function(u,i){
          return '<button type="button" data-i="'+i+'" aria-label="Ir para imagem '+(i+1)+'"'+(i===0?' aria-current="true"':'')+'></button>';
        }).join('');
        return '<div class="carousel" data-carousel>'+
          '<div class="carousel-track">'+slides+'</div>'+
          '<button class="cbtn prev" type="button" aria-label="Imagem anterior">‹</button>'+
          '<button class="cbtn next" type="button" aria-label="Próxima imagem">›</button>'+
          '<div class="ccount"><span class="cnow">1</span> / '+imgs.length+'</div>'+
          '<div class="cdots">'+dots+'</div>'+
        '</div>';
      }
      return '<img class="photo" src="'+imgs[0]+'" alt="'+esc(x.title)+'" loading="lazy">';
    }
    if(x.kind==='gif')
      return '<div class="frame '+(x.ratio==='square'?'square':'')+'"><iframe src="'+x.src+'" title="'+esc(x.title)+'" loading="lazy" allowfullscreen></iframe></div>';
    if(x.kind==='spotify'){
      var parts = x.src.split('/');                 // ex.: "episode/ID", "show/ID", "playlist/ID"
      var uri = 'spotify:'+parts[0]+':'+parts[1];
      return '<div class="nplayer" data-uri="'+uri+'">'+
        '<div class="np-embed" aria-hidden="true"><div class="np-embed-inner" data-embed></div></div>'+
        '<div class="np-mask">'+
          '<div class="np-cover" aria-hidden="true"></div>'+
          '<div class="np-main">'+
            '<div class="np-kicker">'+esc(x.meta)+'</div>'+
            '<div class="np-title">'+esc(x.title)+'</div>'+
            '<div class="np-bar" role="slider" aria-label="Progresso" tabindex="0"><div class="np-fill"></div></div>'+
            '<div class="np-times"><span class="np-cur">0:00</span><span class="np-dur">0:00</span></div>'+
            '<div class="np-controls">'+
              '<button class="np-btn" type="button" data-act="back" aria-label="Voltar 15 segundos">↺&#8202;15</button>'+
              '<button class="np-play" type="button" data-act="toggle" aria-label="Tocar ou pausar"><span class="np-ico" aria-hidden="true"></span></button>'+
              '<button class="np-btn" type="button" data-act="fwd" aria-label="Avançar 15 segundos">15&#8202;↻</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }
    if(x.kind==='text')
      return '<div class="prose">'+x.body.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div>';
    return '';
  }

  function itemView(x){
    var c = catOf(x.cat);
    var sibs = itemsOf(x.cat);
    var i = sibs.indexOf(x);
    var next = sibs[(i+1)%sibs.length];
    var nextHtml = (sibs.length>1 && next!==x)
      ? '<a class="nextlink" href="#/p/'+next.id+'"><span><small>Próximo em '+c.label+'</small>'+esc(next.title)+'</span> →</a>' : '';
    var desc = x.desc ? '<p class="meta">'+esc(x.desc)+'</p>' : '';
    var ficha = '';
    if(x.ficha && x.ficha.length){
      var rows = x.ficha.map(function(r){
        return '<div class="row"><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>';
      }).join('');
      ficha = '<section class="ficha"><h2>Ficha técnica</h2><dl>'+rows+'</dl></section>';
    }
    var prog = (x.kind==='text') ? '<div class="progress" id="readProgress"></div>' : '';
    return '<article class="wrap"><div class="item" style="--c:var(--c-'+x.cat+')">'+
      prog+
      crumbs([{label:'gabu',href:'#/'},{label:c.label,href:'#/c/'+x.cat},{label:x.title}])+
      '<h1>'+esc(x.title)+'</h1>'+
      '<div class="meta">'+esc(x.meta)+'</div>'+
      '<div class="item-body'+(ficha?' has-aside':'')+'">'+
        '<div class="item-main"><div class="media">'+mediaHtml(x)+'</div>'+desc+'</div>'+
        (ficha ? '<aside class="item-aside">'+ficha+'</aside>' : '')+
      '</div>'+
      '<div class="share">'+
        '<button class="btn" id="shareBtn">'+SHARE_IC+'<span>Copiar link</span></button>'+
        nextHtml+
      '</div>'+
    '</div></article>';
  }

  /* ---------- router ---------- */
  function contactView(){
    return '<article class="wrap contact-page"><div class="item" style="--c:var(--c-escrita)">'+
      crumbs([{label:'gabu',href:'#/'},{label:'Contato'}])+
      '<form id="contactForm" class="form" name="contato" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>'+
        '<input type="hidden" name="form-name" value="contato">'+
        '<p hidden><label>Não preencha: <input name="bot-field"></label></p>'+
        '<label class="field"><span>Nome</span><input name="nome" autocomplete="name" placeholder="como te chamo?" required></label>'+
        '<label class="field"><span>E-mail</span><input type="email" name="email" autocomplete="email" placeholder="pra onde respondo" required></label>'+
        '<label class="field"><span>Assunto</span><input name="assunto" placeholder="do que se trata"></label>'+
        '<label class="field msg"><span>Mensagem</span><textarea name="mensagem" rows="3" placeholder="me conta a ideia" required></textarea></label>'+
        '<button class="btn primary" type="submit">Enviar mensagem →</button>'+
        '<p class="formnote" id="formNote" hidden></p>'+
      '</form>'+
      '<p class="alt">Prefere e-mail direto? <a href="mailto:'+esc(SITE.email)+'">'+esc(SITE.email)+'</a></p>'+
    '</div></article>';
  }

  function resolve(){
    var h = location.hash.replace(/^#\/?/,'');
    var parts = h.split('/').filter(Boolean);
    if(parts[0]==='contato') return contactView();
    if(parts[0]==='c' && catOf(parts[1])) return catView(catOf(parts[1]));
    if(parts[0]==='p' && itemOf(parts[1])) return itemView(itemOf(parts[1]));
    return homeView();
  }

  var app = document.getElementById('app');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var first = true;

  function bind(){
    var cf = document.getElementById('contactForm');
    if(cf){
      cf.addEventListener('submit', function(e){
        e.preventDefault();
        var note = document.getElementById('formNote');
        if(!cf.checkValidity()){
          note.hidden=false; note.textContent='Preencha nome, e-mail e mensagem.'; return;
        }
        var d = new FormData(cf);
        var params = new URLSearchParams();
        d.forEach(function(v,k){ params.append(k, v); });
        if(!params.get('form-name')) params.append('form-name','contato');
        note.hidden=false; note.textContent='Enviando…';
        var btn = cf.querySelector('button[type="submit"]');
        if(btn) btn.disabled = true;
        fetch('/', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: params.toString()})
          .then(function(r){ if(!r.ok) throw new Error('http '+r.status); })
          .then(function(){ note.textContent='Mensagem enviada! Em breve te respondo. Obrigado.'; cf.reset(); })
          .catch(function(){
            // fallback: abre o e-mail do visitante
            var subj = (d.get('assunto')||('Contato via gabu — '+(d.get('nome')||''))).toString();
            var body = 'Nome: '+(d.get('nome')||'')+'\n\n'+(d.get('mensagem')||'')+'\n\n— '+(d.get('email')||'');
            note.textContent='Não consegui enviar pelo site. Abrindo seu e-mail…';
            window.location.href = 'mailto:'+SITE.email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
          })
          .finally(function(){ if(btn) btn.disabled = false; });
      });
    }
    initPlayers();

    // páginas de categoria: reveal suave no scroll
    var lis = document.querySelectorAll('.list li');
    if(lis.length){
      if('IntersectionObserver' in window && !reduce){
        var io2 = new IntersectionObserver(function(entries){
          entries.forEach(function(e){
            if(e.isIntersecting){ e.target.classList.add('seen'); io2.unobserve(e.target); }
          });
        }, {rootMargin:'0px 0px -12% 0px'});
        lis.forEach(function(li){ io2.observe(li); });
      } else {
        lis.forEach(function(li){ li.classList.add('seen'); });
      }
    }

    document.querySelectorAll('[data-carousel]').forEach(function(car){
      var track = car.querySelector('.carousel-track');
      var slides = car.querySelectorAll('.slide');
      var dots = car.querySelectorAll('.cdots button');
      var now = car.querySelector('.cnow');
      function current(){ return Math.round(track.scrollLeft / track.clientWidth); }
      function go(i){ i=Math.max(0,Math.min(slides.length-1,i)); track.scrollTo({left:track.clientWidth*i,behavior:'smooth'}); }
      var next=car.querySelector('.next'), prev=car.querySelector('.prev');
      if(next) next.addEventListener('click', function(){ go(current()+1); });
      if(prev) prev.addEventListener('click', function(){ go(current()-1); });
      dots.forEach(function(d){ d.addEventListener('click', function(){ go(+d.dataset.i); }); });
      var t;
      track.addEventListener('scroll', function(){
        clearTimeout(t);
        t=setTimeout(function(){
          var c=current();
          if(now) now.textContent=(c+1);
          dots.forEach(function(d,i){ d.setAttribute('aria-current', i===c?'true':'false'); });
        }, 60);
      }, {passive:true});
    });

    var sb = document.getElementById('shareBtn');
    if(sb){
      sb.addEventListener('click', function(){
        var url = location.href;
        var label = sb.querySelector('span');
        var done = function(){ label.textContent='Link copiado!'; setTimeout(function(){label.textContent='Copiar link';},1800); };
        if(navigator.share && matchMedia('(hover:none)').matches){ navigator.share({url:url}).catch(function(){}); return; }
        if(navigator.clipboard){ navigator.clipboard.writeText(url).then(done).catch(done); }
        else { done(); }
      });
    }
  }

  function updateProgress(){
    var el = document.getElementById('readProgress');
    if(!el) return;
    var d = document.documentElement;
    var max = d.scrollHeight - window.innerHeight;
    var p = max > 0 ? (d.scrollTop || document.body.scrollTop) / max : 0;
    el.style.width = Math.max(0, Math.min(1, p)) * 100 + '%';
  }
  window.addEventListener('scroll', updateProgress, {passive:true});
  window.addEventListener('resize', updateProgress);

  // mouse-tracking "gabu" on the home
  var mx=-300, my=-300, cgx=-300, cgy=-300, mouseSeen=false;
  window.addEventListener('mousemove', function(e){ mx=e.clientX; my=e.clientY; mouseSeen=true; }, {passive:true});
  (function cgLoop(){
    var el = document.querySelector('.cursor-gabu');
    if(el){
      cgx += (mx - cgx) * 0.16;
      cgy += (my - cgy) * 0.16;
      el.style.transform = 'translate3d('+(cgx+18)+'px,'+(cgy+18)+'px,0)';
      el.style.opacity = mouseSeen ? '1' : '0';
    }
    requestAnimationFrame(cgLoop);
  })();

  function updateDocTitle(){
    var parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
    var t = 'gabu';
    if(parts[0]==='p' && itemOf(parts[1])){ var x=itemOf(parts[1]); t='gabu | '+catOf(x.cat).label+' | '+x.title; }
    else if(parts[0]==='c' && catOf(parts[1])){ t='gabu | '+catOf(parts[1]).label; }
    else if(parts[0]==='contato'){ t='gabu | Contato'; }
    document.title = t.toLowerCase();
  }

  function updateCursor(){
    var cg = document.querySelector('.cursor-gabu');
    if(!cg) return;
    var parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
    var accent = null;
    if(parts[0]==='p' && itemOf(parts[1])) accent = itemOf(parts[1]).cat;      // publicação
    else if(parts[0]==='c' && catOf(parts[1])) accent = parts[1];              // categoria
    cg.style.color = accent ? 'var(--c-'+accent+')' : 'var(--ink)';
  }

  function render(){
    var html = resolve();
    if(reduce || first){ app.innerHTML = html; window.scrollTo(0,0); first=false; bind(); updateProgress(); updateCursor(); updateDocTitle(); return; }
    app.classList.add('is-leaving');
    setTimeout(function(){
      app.innerHTML = html; window.scrollTo(0,0);
      // reflow then reveal
      void app.offsetWidth;
      app.classList.remove('is-leaving');
      bind(); updateProgress(); updateCursor(); updateDocTitle();
    }, 200);
  }

  window.addEventListener('hashchange', render);

  // carrega o conteúdo gerado pelo build (content.json) e então renderiza
  fetch('content.json', {cache:'no-cache'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if(data){
        if(Array.isArray(data.items)) ITEMS = data.items;
        if(data.config){
          if(data.config.email) SITE.email = data.config.email;
          if(Array.isArray(data.config.socials) && data.config.socials.length) SITE.socials = data.config.socials;
        }
      }
    })
    .catch(function(){})
    .finally(function(){ render(); });
})();
</script>
<script async src="https://open.spotify.com/embed/iframe-api/v1"></script>
