# Build: gera o content.json a partir de content/publicacoes/*.md
[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Cache leve para as imagens
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# O painel /admin nunca deve ser cacheado agressivamente
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
